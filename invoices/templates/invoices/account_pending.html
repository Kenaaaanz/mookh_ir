{% extends 'invoices/base.html' %}
{% block content %}
<div class="pending-approval-container">
    <div class="pending-approval-card">
        <!-- Icon/Illustration Area -->
        <div class="icon-wrapper">
            <svg class="pending-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <!-- Title -->
        <h1 class="pending-title">Account Pending Approval</h1>
        
        <!-- Main Message -->
        <p class="pending-message">
            Thank you for signing up. Your account is awaiting admin approval before you can create invoices and reports.
        </p>
        
        <!-- Secondary Info -->
        <div class="info-banner">
            <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p>Once approved, you will receive access to the dashboard immediately.</p>
        </div>
        
        <!-- Logout Button -->
        <form method="post" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="btn-logout">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sign Out
            </button>
        </form>
    </div>
</div>

<style>
    /* ============================================
       Pending Approval Page - Enhanced Styling
       ============================================ */
    
    /* Container - Centers card vertically and horizontally */
    .pending-approval-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        padding: 2rem 1rem;
    }
    
    /* Main Card - Modern, elevated design */
    .pending-approval-card {
        max-width: 550px;
        width: 100%;
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        border-radius: 32px;
        padding: 3rem 2.5rem;
        text-align: center;
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15), 
                    0 1px 3px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .pending-approval-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.2);
    }
    
    /* Icon Wrapper - Circular background */
    .icon-wrapper {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        border-radius: 50%;
        width: 88px;
        height: 88px;
        margin-bottom: 1.75rem;
        box-shadow: 0 8px 16px -6px rgba(245, 158, 11, 0.2);
    }
    
    .pending-icon {
        width: 48px;
        height: 48px;
        color: #d97706;
        stroke-width: 1.5;
    }
    
    /* Title Styling */
    .pending-title {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        margin-bottom: 1.25rem;
        letter-spacing: -0.01em;
    }
    
    /* Main Message */
    .pending-message {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #475569;
        margin-bottom: 1.75rem;
        font-weight: 500;
    }
    
    /* Info Banner - Highlighted info box */
    .info-banner {
        background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
        border-left: 4px solid #3b82f6;
        border-radius: 16px;
        padding: 1rem 1.25rem;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-align: left;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    
    .info-icon {
        width: 24px;
        height: 24px;
        color: #2563eb;
        flex-shrink: 0;
        stroke-width: 2;
    }
    
    .info-banner p {
        margin: 0;
        font-size: 0.95rem;
        color: #1e40af;
        font-weight: 500;
        line-height: 1.4;
    }
    
    /* Logout Button - Modern, interactive */
    .logout-form {
        margin-top: 0.5rem;
    }
    
    .btn-logout {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
        border: none;
        padding: 0.9rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 60px;
        cursor: pointer;
        transition: all 0.25s ease;
        width: 100%;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        font-family: inherit;
    }
    
    .btn-logout:hover {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
    }
    
    .btn-logout:active {
        transform: translateY(0);
    }
    
    .btn-icon {
        width: 20px;
        height: 20px;
        stroke-width: 2;
        transition: transform 0.2s ease;
    }
    
    .btn-logout:hover .btn-icon {
        transform: translateX(2px);
    }
    
    /* Responsive Adjustments */
    @media (max-width: 640px) {
        .pending-approval-card {
            padding: 2rem 1.5rem;
        }
        
        .pending-title {
            font-size: 1.75rem;
        }
        
        .pending-message {
            font-size: 0.95rem;
        }
        
        .icon-wrapper {
            width: 72px;
            height: 72px;
        }
        
        .pending-icon {
            width: 38px;
            height: 38px;
        }
        
        .info-banner {
            padding: 0.875rem 1rem;
        }
        
        .btn-logout {
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
        }
    }
    
    @media (max-width: 480px) {
        .pending-approval-card {
            padding: 1.75rem 1.25rem;
        }
        
        .pending-title {
            font-size: 1.5rem;
        }
    }
</style>
{% endblock %}
